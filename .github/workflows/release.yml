name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.classify.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Tag must match pyproject version
        run: |
          expected="v$(uv version --short)"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != pyproject version ${expected}" >&2
            exit 1
          fi
      - name: Classify tag and set release channel
        id: classify
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "channel=testpypi" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected tag format: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Tests (unit only, gate before publishing)
        run: |
          uv sync
          uv run pytest -q -m "not integration"
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: needs.build.outputs.channel == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: needs.build.outputs.channel == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with commit-based notes and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes from commits since the previous stable tag: this repo takes direct
          # commits on main, so PR-based --generate-notes would be empty.
          prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                  | grep -v rc | grep -vx "${GITHUB_REF_NAME}" | head -1)"
          if [ -n "$prev" ]; then
            range="${prev}..${GITHUB_REF_NAME}"
            compare="**Full Changelog**: https://github.com/${GH_REPO}/compare/${prev}...${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
            compare=""
          fi
          {
            echo "## Changes"
            echo
            git log "$range" --no-merges --format='- %s (%h)' \
              | grep -v '^- chore(release):' || true
            echo
            echo "## Install"
            echo
            echo '```'
            echo "uvx --from dataform-context-mcp@latest dataform-context serve"
            echo '```'
            echo
            echo "$compare"
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
