[project]
name = "dataform-context-mcp"
version = "0.5.0"
description = "Deterministic, self-hosted MCP server exposing structured Dataform pipeline context (lineage, schemas, layers) to coding agents"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vincent Gossiaux" }
]
requires-python = ">=3.12"
keywords = ["dataform", "bigquery", "mcp", "lineage", "analytics-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=2.0.0",
    "sqlglot>=30.17.0",
]

[project.urls]
Homepage = "https://github.com/vgossiaux/dataform-context-mcp"
Repository = "https://github.com/vgossiaux/dataform-context-mcp"
Issues = "https://github.com/vgossiaux/dataform-context-mcp/issues"
Changelog = "https://github.com/vgossiaux/dataform-context-mcp/tags"

[project.scripts]
dataform-context = "dataform_context_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the dataform CLI (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
